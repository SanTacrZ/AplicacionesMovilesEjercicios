<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Su Banco</title>
    <!-- Reusing the main stylesheet for consistency -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }

        .welcome-container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1f2937;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-back:hover {
            background-color: #374151;
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <h1 style="color: #1e3a8a;">¡Bienvenido!</h1>
        <p>Ha ingresado correctamente a su Sucursal Virtual.</p>
        <p>Estamos procesando sus datos...</p>
        <a href="index.html" class="btn-back">Cerrar Sesión</a>
    </div>
</body>

</html>
