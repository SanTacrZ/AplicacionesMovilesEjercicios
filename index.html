<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Mario</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="paisaje">
        <img id="nube" class="objeto"
            src="https://icons.iconarchive.com/icons/flaticonmaker/flat-style/128/cloud-icon.png" alt="">
        <img id="bici" class="objeto" src="https://icons.iconarchive.com/icons/aha-soft/transport/128/bike-icon.png"
            alt="">
        <img id="arbol" class="objeto"
            src="https://icons.iconarchive.com/icons/google/noto-emoji-animals-nature/128/22330-deciduous-tree-icon.png"
            alt="">
        <img id="sol" class="objeto" src="https://icons.iconarchive.com/icons/dapino/beach/128/sun-icon.png" alt="">
        <img id="nevado" class="objeto"
            src="https://icons.iconarchive.com/icons/google/noto-emoji-travel-places/512/42462-mountain-icon.png"
            alt="">
        <img id="nevado2" class="objeto"
            src="https://icons.iconarchive.com/icons/google/noto-emoji-travel-places/512/42462-mountain-icon.png"
            alt="">

        <!-- Elementos Interactivos -->
        <div id="bloque" class="objeto">?</div>
        <!-- Hongo (inicialmente oculto en el bloque) -->
        <div id="hongo" class="objeto"></div>

        <!-- Personaje Mario (Imagen local) -->
        <img id="mario" class="objeto" src="mario.png" alt="mario" width="50" height="50">
    </div>

    <script src="script.js"></script>
</body>

</html>
