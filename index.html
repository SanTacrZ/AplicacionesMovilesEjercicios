<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Canal Street Market</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="hero">

        <!-- Logo -->
        <header class="logo">
            <img src="assets/logo.png" alt="CSM Logo">
        </header>

        <!-- Texto principal -->
        <section class="content">
            <h1>
                Canal Street Market is a carefully curated retail market, food hall & community space open year-round at
                265 Canal Street.
            </h1>
        </section>

        <!-- Barras laterales -->
        <aside class="categories">

            <div class="category blue">
                <img src="assets/kanji-food.png" class="kanji">
                <span>Food</span>
            </div>

            <div class="category red">
                <img src="assets/kanji-retail.png" class="kanji">
                <span>Retail</span>
            </div>

            <div class="category yellow">
                <img src="assets/kanji-community.png" class="kanji">
                <span>Community</span>
            </div>

        </aside>

    </main>

    <!-- BLOQUE IMAGEN GRANDE -->
    <section class="gallery-preview">
        <img src="assets/space-image.png" alt="Gallery Space">
    </section>


</body>

</html>
